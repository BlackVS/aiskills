name: Release

# Two ways to cut a release; either way VERSION and a CHANGELOG section for
# the version must already be on main (rolled in by the PR that bumps it):
#   - Actions -> Release -> Run workflow on main with the version (1.22.1):
#     tags the tip of main and publishes. Given an existing tag, it publishes
#     that tag instead (for example after a run that failed or was cancelled).
#   - Push a tag on main: git tag -a v1.22.1 origin/main -m "aiskills 1.22.1" && git push origin v1.22.1
# The one-line installers install the latest release, so a release is what
# users get by default.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.22.1 (tags main unless the tag exists)'
        required: true

permissions:
  contents: write   # push the tag, create the release, upload its assets

# One release at a time across all tags, so each run decides "latest" after
# every earlier run has published. GitHub keeps at most one run waiting per
# group: a third run started meanwhile cancels the waiting one, which then
# publishes nothing; run the workflow again with that version to publish it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: the release script needs merge-base
          persist-credentials: false   # only the steps below that write get the token

      - name: Resolve the release
        run: bash .github/release.sh resolve

      # The script checks out the commit to release (the tag, or main's tip),
      # which may predate the script: run the copy from the workflow's commit.
      - name: Check the commit, VERSION and CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/release.sh "$RUNNER_TEMP/release.sh"
          bash "$RUNNER_TEMP/release.sh" prepare "$TAG" $CREATE

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test before publishing
        run: |
          python -m unittest discover -s . -p "test_*.py" -t .
          python -m unittest discover -s consumers/openhands-review-hook/runtime -p "test_*.py"
          python consumers/openhands-review-hook/render.py --check

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # git's credential for this step only (checkout kept none): the tag push
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          bash "$RUNNER_TEMP/release.sh" publish "$TAG" $CREATE
