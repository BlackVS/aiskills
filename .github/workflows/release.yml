name: Release

# Cut a release by pushing a tag for the version on main:
#   git tag v1.22.0 origin/main && git push origin v1.22.0
# The one-line installers (boot.sh / boot.ps1) install the latest release, so
# a release is what users get by default.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.22.0)'
        required: true

permissions:
  contents: write   # create the release and upload its assets

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0   # full history: the guard below needs merge-base
          persist-credentials: false

      # Releases ship only what main has merged through a reviewed PR: a tag
      # on a commit that is not on main is refused.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tagged commit $(git rev-parse --short HEAD) is not on main; merge first, then tag"
            exit 1
          fi

      - name: Verify VERSION and CHANGELOG match the tag
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          ver=$(tr -d '[:space:]' < VERSION)
          if [ "v$ver" != "$TAG" ]; then
            echo "::error::VERSION says $ver, the tag is $TAG"; exit 1
          fi
          # The release body is the version's CHANGELOG section, written by a
          # person or an agent about what changed. Roll [Unreleased] into the
          # version BEFORE tagging.
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md has no section for $ver"; exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test before publishing
        run: |
          python -m unittest discover -s . -p "test_*.py" -t .
          python -m unittest discover -s consumers/openhands-review-hook/runtime -p "test_*.py"
          python consumers/openhands-review-hook/render.py --check

      # The tag's archive is what the one-liners download; the assets are the
      # same tree for offline installs (AI_SKILLS_ARCHIVE=<file> bash boot.sh),
      # with checksums.
      - name: Build release archives
        run: |
          ver=${TAG#v}
          mkdir -p dist
          git archive --format=tar.gz --prefix="aiskills-$ver/" -o "dist/aiskills-$ver.tar.gz" HEAD
          git archive --format=zip --prefix="aiskills-$ver/" -o "dist/aiskills-$ver.zip" HEAD
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Latest" is what the one-liners install, so only the highest version
          # gets it: a patch release for an older line must not downgrade users.
          newest=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          latest=false; [ "$newest" = "$TAG" ] && latest=true
          echo "newest tag: $newest; marking $TAG as latest: $latest"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --latest="$latest" \
            --title "ai-skills ${TAG#v}" --notes-file release_notes.md
